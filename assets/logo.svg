<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="grad-main" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
    <linearGradient id="grad-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Rounded Shield -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="#0F172A" stroke="url(#grad-main)" stroke-width="3" />
  
  <!-- Inner Subtle Grid Lines -->
  <circle cx="64" cy="64" r="42" fill="none" stroke="#334155" stroke-width="1" stroke-dasharray="3,3" />
  <circle cx="64" cy="64" r="28" fill="none" stroke="#1E293B" stroke-width="1.5" />
  
  <!-- Left Code Bracket < -->
  <path d="M 40 46 L 26 64 L 40 82" fill="none" stroke="url(#grad-accent)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Right Code Bracket > -->
  <path d="M 88 46 L 102 64 L 88 82" fill="none" stroke="url(#grad-accent)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Center Brain / Compass Star / Lightbulb Core -->
  <g filter="url(#glow)">
    <circle cx="64" cy="64" r="7" fill="url(#grad-main)" />
    
    <line x1="64" y1="57" x2="64" y2="42" stroke="url(#grad-main)" stroke-width="3" stroke-linecap="round" />
    <circle cx="64" cy="40" r="4" fill="#38BDF8" />
    
    <line x1="64" y1="71" x2="64" y2="86" stroke="url(#grad-main)" stroke-width="3" stroke-linecap="round" />
    <circle cx="64" cy="88" r="4" fill="#EC4899" />
    
    <line x1="57" y1="60" x2="47" y2="52" stroke="url(#grad-main)" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="45" cy="50" r="3.5" fill="#818CF8" />
    
    <line x1="71" y1="60" x2="81" y2="52" stroke="url(#grad-main)" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="83" cy="50" r="3.5" fill="#A855F7" />
    
    <line x1="57" y1="68" x2="47" y2="76" stroke="url(#grad-main)" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="45" cy="78" r="3.5" fill="#38BDF8" />
    
    <line x1="71" y1="68" x2="81" y2="76" stroke="url(#grad-main)" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="83" cy="78" r="3.5" fill="#F43F5E" />
  </g>
</svg>
